name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository URL or owner/name"
        required: true
        type: string
      project_path:
        description: "Optional path to .xcodeproj or .xcworkspace (auto-detected if blank)"
        required: false
        default: ""
        type: string
      scheme:
        description: "Optional Xcode scheme (auto-detected if exactly one is available)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Normalize and validate repository input
        id: repo
        env:
          REPO_INPUT: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          REPO="$REPO_INPUT"
          REPO="${REPO#https://github.com/}"
          REPO="${REPO#http://github.com/}"
          REPO="${REPO%.git}"
          REPO="${REPO%/}"
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Inserisci un URL GitHub pubblico oppure owner/name."
            exit 1
          fi
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout source and submodules
        env:
          REPO: ${{ steps.repo.outputs.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$REPO.git" source
          cd source
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Detect Xcode project and scheme
        id: detect
        env:
          PROJECT_INPUT: ${{ inputs.project_path }}
          SCHEME_INPUT: ${{ inputs.scheme }}
        run: |
          set -euo pipefail
          cd source

          if [[ -n "$PROJECT_INPUT" ]]; then
            PROJECT_PATH="$PROJECT_INPUT"
            if [[ ! -e "$PROJECT_PATH" ]]; then
              echo "::error::Il percorso indicato non esiste: $PROJECT_PATH"
              exit 1
            fi
          else
            # Use Bash 3.2-compatible arrays (the default Bash on macOS).
            WORKSPACES=()
            PROJECTS=()
            while IFS= read -r item; do WORKSPACES+=("$item"); done < <(
              find . -type d -name '*.xcworkspace' \
                -not -path '*/Pods/*' -not -path '*/Carthage/*' \
                -not -path '*/.build/*' -not -path '*/DerivedData/*' | sort
            )
            while IFS= read -r item; do PROJECTS+=("$item"); done < <(
              find . -type d -name '*.xcodeproj' \
                -not -path '*/Pods/*' -not -path '*/Carthage/*' \
                -not -path '*/.build/*' -not -path '*/DerivedData/*' | sort
            )

            if [[ ${#WORKSPACES[@]} -eq 1 ]]; then
              PROJECT_PATH="${WORKSPACES[0]#./}"
            elif [[ ${#WORKSPACES[@]} -gt 1 ]]; then
              echo "::error::Trovati più workspace. Specifica project_path manualmente:"
              printf '%s\n' "${WORKSPACES[@]}"
              exit 1
            elif [[ ${#PROJECTS[@]} -eq 1 ]]; then
              PROJECT_PATH="${PROJECTS[0]#./}"
            elif [[ ${#PROJECTS[@]} -gt 1 ]]; then
              echo "::error::Trovati più progetti Xcode. Specifica project_path manualmente:"
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            else
              echo "::error::Non ho trovato file .xcodeproj o .xcworkspace. Il progetto potrebbe richiedere XcodeGen, Tuist o un altro sistema di generazione."
              exit 1
            fi
          fi

          if [[ "$PROJECT_PATH" == *.xcworkspace ]]; then
            LIST_JSON="$(xcodebuild -list -json -workspace "$PROJECT_PATH")"
          elif [[ "$PROJECT_PATH" == *.xcodeproj ]]; then
            LIST_JSON="$(xcodebuild -list -json -project "$PROJECT_PATH")"
          else
            echo "::error::project_path deve indicare un file .xcodeproj o .xcworkspace."
            exit 1
          fi

          printf '%s\n' "$LIST_JSON" > "$RUNNER_TEMP/xcode-list.json"

          if [[ -n "$SCHEME_INPUT" ]]; then
            SCHEME="$SCHEME_INPUT"
          else
            SCHEME="$(python3 - <<'PY'
          import json, os, sys
          with open(os.path.join(os.environ["RUNNER_TEMP"], "xcode-list.json")) as f:
              data = json.load(f)
          root = data.get("workspace") or data.get("project") or {}
          schemes = root.get("schemes", [])
          if len(schemes) != 1:
              print("Scheme non univoco; disponibili: " + (", ".join(schemes) or "nessuno"), file=sys.stderr)
              sys.exit(2)
          print(schemes[0])
          PY
          )" || {
            echo "::error::Impossibile scegliere automaticamente uno scheme. Inserisci il nome del scheme nel campo opzionale."
            exit 1
          }
          fi

          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Progetto selezionato: $PROJECT_PATH"
          echo "Scheme selezionato: $SCHEME"

      - name: Build app for device (unsigned)
        env:
          PROJECT_PATH: ${{ steps.detect.outputs.project_path }}
          SCHEME: ${{ steps.detect.outputs.scheme }}
        run: |
          set -euo pipefail
          cd source
          if [[ "$PROJECT_PATH" == *.xcworkspace ]]; then
            PROJECT_ARG=(-workspace "$PROJECT_PATH")
          else
            PROJECT_ARG=(-project "$PROJECT_PATH")
          fi

          set -o pipefail
          xcodebuild "${PROJECT_ARG[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' ! -name '*Tests.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "::error::Nessuna app .app trovata in $APP_DIR"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/app-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: app-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
