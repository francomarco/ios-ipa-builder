name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository in owner/name format"
        required: true
        type: string
      project_path:
        description: "Relative path to .xcodeproj or .xcworkspace"
        required: true
        type: string
      scheme:
        description: "Xcode scheme name"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Validate repository input
        env:
          REPO: ${{ inputs.repository }}
        run: |
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repository. Use owner/name."
            exit 1
          fi

      - name: Checkout source repository
        env:
          REPO: ${{ inputs.repository }}
        run: git clone --depth 1 "https://github.com/${REPO}.git" source

      - name: Show Xcode schemes (diagnostic)
        run: |
          cd source
          find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print
          xcodebuild -version

      - name: Build app for device (unsigned)
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          cd source
          if [[ "$PROJECT_PATH" == *.xcworkspace ]]; then
            PROJECT_ARG=(-workspace "$PROJECT_PATH")
          elif [[ "$PROJECT_PATH" == *.xcodeproj ]]; then
            PROJECT_ARG=(-project "$PROJECT_PATH")
          else
            echo "project_path must end in .xcodeproj or .xcworkspace"
            exit 1
          fi

          xcodebuild "${PROJECT_ARG[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' ! -name '*Tests.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "No .app found in $APP_DIR"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/app-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: app-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
